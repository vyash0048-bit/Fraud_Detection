  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Checkout Code
  #       uses: actions/checkout@v4
  #
  #     - name: Log in to Docker Hub
  #       uses: docker/login-action@v3
  #       with:
  #         username: ${{ secrets.DOCKER_USERNAME }}
  #         password: ${{ secrets.DOCKER_PASSWORD }}
  #
  #     - name: Build and Push Docker Image
  #       uses: docker/build-push-action@v5
  #       with:
  #         context: .
  #         push: true
  #         tags: yourusername/fraud-detection-api:latest


  deploy-to-ec2:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Clone repo if it doesn't exist, else pull latest
            if [ ! -d "Fraud_Detection" ]; then
              git clone https://github.com/vyash0048-bit/Fraud_Detection.git
              cd Fraud_Detection
            else
              cd Fraud_Detection
              git pull origin master
            fi
            
            # Clean up any old standalone containers before using compose
            docker stop fraud-api || true
            docker rm fraud-api || true
            
            # Rebuild and restart the Docker containers using compose
            docker compose down || true
            docker compose up -d --build