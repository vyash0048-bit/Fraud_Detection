LightGBM:
  n_estimators: [300, 500, 1000]
  learning_rate: [0.01, 0.05, 0.1]
  max_depth: [-1, 10, 15]
  num_leaves: [31, 63, 127]
  min_child_samples: [20, 50, 100]
  subsample: [0.8, 1.0]
  colsample_bytree: [0.6, 0.8, 1.0]
  scale_pos_weight: [1.0, 5.0]
  n_iter_search: 10

FeatureSelection:
  enabled: true
  top_n_features: 150
