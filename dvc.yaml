stages:
  data_ingestion:
    cmd: python src/FraudDetectionAI/pipeline/stage_01_data_ingestion.py
    deps:
      - src/FraudDetectionAI/pipeline/stage_01_data_ingestion.py
      - src/FraudDetectionAI/components/data_ingestion.py
      - config/config.yaml
    outs:
      - artifacts/data_ingestion/dataset

  data_preprocessing:
    cmd: python src/FraudDetectionAI/pipeline/stage_02_data_preprocessing.py
    deps:
      - src/FraudDetectionAI/pipeline/stage_02_data_preprocessing.py
      - src/FraudDetectionAI/components/data_preprocessing.py
      - config/config.yaml
      - artifacts/data_ingestion/dataset
    outs:
      - artifacts/data_preprocessing/train_preprocessed.csv
      - artifacts/data_preprocessing/test_preprocessed.csv
