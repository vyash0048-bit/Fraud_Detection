  train_data_path: artifacts/data_ingestion/dataset/train_transaction.csv
  train_identity_path: artifacts/data_ingestion/dataset/train_identity.csv
  test_data_path: artifacts/data_ingestion/dataset/test_transaction.csv
  test_identity_path: artifacts/data_ingestion/dataset/test_identity.csv
